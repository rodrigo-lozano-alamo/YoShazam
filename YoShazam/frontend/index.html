<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0618" />
    <meta name="description" content="YoShazam: adivina canciones con tus amigos usando tus playlists de Spotify." />
    <title>YoShazam · Adivina la canción</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script>
      window.__YOSHAZAM_BACKEND_BASE__ = window.__YOSHAZAM_BACKEND_BASE__ || `${window.location.protocol}//${window.location.hostname}:3001`;
      const socketScript = document.createElement('script');
      socketScript.src = `${window.__YOSHAZAM_BACKEND_BASE__}/socket.io/socket.io.js`;
      document.head.appendChild(socketScript);
    </script>
    <script src="./app.js"></script>
  </body>
</html>
